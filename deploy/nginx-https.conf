server {
 listen 80;
 server_name softwarenextgen.com www.softwarenextgen.com;
 location /.well-known/acme-challenge/ { root /var/www/nextgensoftware-acme; }
 location / { return 301 https://softwarenextgen.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name www.softwarenextgen.com;
 ssl_certificate /etc/letsencrypt/live/softwarenextgen.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/softwarenextgen.com/privkey.pem;
 return 308 https://softwarenextgen.com$request_uri;
}
server {
 listen 443 ssl;
 server_name softwarenextgen.com;
 ssl_certificate /etc/letsencrypt/live/softwarenextgen.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/softwarenextgen.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 client_max_body_size 1024m;
 include /etc/nginx/snippets/dme-landing-cloudflare-realip.conf;
 location /preview/components/ {
  proxy_pass http://127.0.0.1:5340;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_buffering off;
  proxy_read_timeout 300s;
  add_header Cache-Control "no-store" always;
 }
 location ~ /\. { deny all; }
 location / {
  proxy_pass http://127.0.0.1:5338;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_buffering off;
  proxy_read_timeout 1800s;
  proxy_send_timeout 1800s;
 }
}
