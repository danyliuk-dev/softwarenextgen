<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title"><title id="title">Share a desktop with permission</title><rect width="960" height="380" rx="20" fill="#eef4f2"/><g stroke="#395b54" stroke-width="3"><rect x="55" y="65" width="295" height="190" rx="12" fill="white"/><rect x="610" y="65" width="295" height="190" rx="12" fill="white"/><path d="M155 280h95m460 0h95M203 255v25m555-25v25"/><path d="M370 155h220" stroke-dasharray="8 8"/></g><g font-family="Arial,sans-serif" fill="#233d37" text-anchor="middle"><text x="203" y="108" font-size="20" font-weight="bold">Share desktop</text><text x="757" y="108" font-size="20" font-weight="bold">Connect</text><text x="203" y="150" font-size="15">Access key</text><text x="203" y="180" font-size="21">•••• •••• ••••</text><rect x="660" y="130" width="195" height="38" rx="6" fill="#edf2f0"/><text x="757" y="155" font-size="15">Enter the host’s key</text><rect x="660" y="185" width="195" height="38" rx="6" fill="#395b54"/><text x="757" y="210" fill="white" font-size="15">Request control</text><circle cx="480" cy="155" r="37" fill="#395b54"/><path d="M469 151v-10a11 11 0 0 1 22 0v10m-25 0h28v23h-28z" fill="none" stroke="white" stroke-width="3"/><text x="480" y="225" font-size="15">Encrypted connection</text><text x="480" y="335" font-size="20">The host chooses who can control the screen.</text></g></svg>